# Copy to config/people.yml and keep local changes out of version control.
# Identity overrides contain no credentials or source tokens.
owner: john
people:
  john:
    identities:
      github: jrose-wealthbox
      slack: U001
      linear: 11111111-1111-1111-1111-111111111111
    role: software_engineer
    level: senior
  excluded-contractor:
